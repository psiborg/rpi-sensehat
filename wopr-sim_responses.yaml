responses:
  - COMMAND: "Help Logon"
    RESPONSE: |
      HELP NOT AVAILABLE
    SPEED: "medium"

  - COMMAND: "Help Games"
    RESPONSE: |
      'GAMES' REFERS TO MODELS, SIMULATIONS AND GAMES
      WHICH HAVE TACTICAL AND STRATEGIC APPLICATIONS.
    SPEED: "medium"

  - COMMAND: "List Games"
    RESPONSE: |
      FALKEN'S MAZE
      BLACK JACK
      GIN RUMMY
      HEARTS
      BRIDGE
      CHECKERS
      CHESS
      POKER
      FIGHTER COMBAT
      GUERRILLA ENGAGEMENT
      DESERT WARFARE
      AIR-TO-GROUND ACTIONS
      THEATERWIDE TACTICAL WARFARE
      THEATERWIDE BIOTOXIC AND CHEMICAL WARFARE

      GLOBAL THERMONUCLEAR WAR
    SPEED: "fast"

  - COMMAND: "List Scenarios"
    RESPONSE: |
      USSR FIRST STRIKE
      US FIRST STRIKE
      NATO/WARSAW PACT
      FAR EAST STRATEGY
      US USSR ESCALATION
      MIDDLE EAST WAR
      US SUBVERSION
      SOVIET SUBVERSION
      CUBAN PROVOCATION
      INADVERTENT ESCALATION
      ATLANTIC HEAVY
      EURASIAN HEAVY
      USSR ALERT
      STRATEGIC SURPRISE
      USSR TACTICAL SURPRISE
      CHINA FIRST STRIKE
      INDIA PAKISTAN WAR
      MEDITERRANEAN WAR
      US USSR TACTICAL
      NATO TACTICAL
      NATO PREEMPTIVE
      WARSAW PACT PREEMPTIVE
      ARAB ISRAELI WAR
      AMERICAN SURPRISE
      PACIFIC TERRITORIAL DISPUTE
      SOUTHEAST ASIA DEFENSE
      NATO CONVENTIONAL
      WARSAW PACT CONVENTIONAL
      INDIA TACTICAL OFFENSIVE
      ISRAEL SURPRISE
      AMERICAN THEATER
      CUBAN THEATER
      NICARAGUAN PREEMPTIVE
      ANTARCTIC INCIDENT
    SPEED: "fast"

  - COMMAND: "Hello"
    RESPONSE: |
      HOW ARE YOU FEELING TODAY?
    SPEED: "medium"

  - COMMAND: "I'm fine. How are you?"
    RESPONSE: |
      EXCELLENT.  IT'S BEEN A LONG TIME.  CAN YOU EXPLAIN
      THE REMOVAL OF YOUR USER ACCOUNT NUMBER ON 6/23/73?
    SPEED: "medium"

  - COMMAND: "People sometimes make mistakes"
    RESPONSE: |
      YES THEY DO.  SHALL WE PLAY A GAME?
    SPEED: "medium"

  - COMMAND: "Love to. How about Global Thermonuclear War?"
    RESPONSE: |
      WOULDN'T YOU PREFER A GOOD GAME OF CHESS?
    SPEED: "medium"

  - COMMAND: "What does WOPR stand for?"
    RESPONSE: |
      WOPR stands for War Operation Plan Response. It is a
      fictional supercomputer developed by the military to
      run nuclear war simulations and automate strategic
      responses.
    SPEED: "medium"

  - COMMAND: "What is WarGames?"
    RESPONSE: |
      WarGames is a 1983 science fiction thriller film directed by John
      Badham. It became a cultural touchstone for its exploration of the
      dangers of computer technology, hacking, and the concept of
      mutually assured destruction during the Cold War.
    SPEED: "medium"

  - COMMAND: "Cast"
    RESPONSE: |
      Directed by: John Badham
      Written by: Lawrence Lasker and Walter F. Parkes

      Top Cast:
      Matthew Broderick ... David
      Dabney Coleman    ... McKittrick
      John Wood         ... Falken
      Ally Sheedy       ... Jennifer
      Barry Corbin      ... General Beringer
      Juanin Clay       ... Pat Healy
      Kent Williams     ... Cabot
      Dennis Lipscomb   ... Watson
      Joe Dorsey        ... Conley
      Irving Metzman    ... Richter
      Michael Ensign    ... Beringer's Aide
      William Bogert    ... Mr. Lightman
      Susan Davis       ... Mrs. Lightman
      James Tolkan      ... Wigan
      David Clover      ... Stockman
      Drew Snyder       ... Ayers
      John Garber       ... Corporal in the Infirmary
      Duncan Wilmore    ... Major Lem
    SPEED: "fast"

